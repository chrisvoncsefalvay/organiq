name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --constraint constraints/isaac-5.1.txt ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run extension checks
        run: |
          python tools/check_extension.py
          python -m compileall -q source tests tools

      - name: Package release archives
        run: |
          python tools/package_extension.py --clean
          python tools/check_distribution.py --require-archives
