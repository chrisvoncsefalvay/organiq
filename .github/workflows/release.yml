name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package extension
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --constraint constraints/isaac-5.1.txt ".[dev]"

      - name: verify tag matches manifest
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = pathlib.Path("source/extensions/com.chrisvoncsefalvay.organiq/config/extension.toml")
          version = tomllib.loads(manifest.read_text(encoding="utf-8"))["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual} does not match manifest version {expected}")
          PY

      - name: run release checks
        run: |
          python -m pytest
          python tools/check_extension.py
          python -m compileall -q source tests tools
          python tools/package_extension.py --clean
          python tools/check_distribution.py --require-archives

      - name: publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file source/extensions/com.chrisvoncsefalvay.organiq/docs/CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
