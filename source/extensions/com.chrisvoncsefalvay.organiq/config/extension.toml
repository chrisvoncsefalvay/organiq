[package]
name = "com.chrisvoncsefalvay.organiq"
version = "0.1.0"
category = "Simulation"
feature = true
title = "Organiq"
description = "CT DICOM to MONAI segmentation, USD meshing and Isaac physics authoring"
authors = ["Chris von Csefalvay"]
repository = "https://github.com/chrisvoncsefalvay/organiq"
keywords = ["omniverse", "kit", "extension", "isaac", "dicom", "ct", "monai", "usd", "physics"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[package.target]
platform = ["linux-x86_64", "windows-x86_64"]
python = ["*"]
kit = ["107.3.3"]

[dependencies]
"isaacsim.gui.components" = {}
"omni.kit.menu.utils" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.uiapp" = {}
"omni.usd" = {}
"omni.timeline" = {}
"omni.anim.window.timeline" = {}
"omni.anim.widget.timeline" = {}
"omni.kit.widget.timeline" = {}
"omni.physx" = {}
"omni.physx.bundle" = {}
"omni.physx.ui" = {}
"omni.physx.commands" = {}
"omni.usdphysics.ui" = {}
"omni.physics.physx" = {}
"omni.physics.stageupdate" = {}

[[python.module]]
name = "com.chrisvoncsefalvay.organiq"
