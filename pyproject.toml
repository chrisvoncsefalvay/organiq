[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organiq"
version = "0.1.0"
description = "Sim Ready anatomy from DICOM volumes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris von Csefalvay" }]
keywords = ["omniverse", "kit", "isaac", "dicom", "ct", "monai", "usd", "physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "numpy>=1.26.4,<2",
    "scipy>=1.11,<1.17",
    "scikit-image>=0.22,<0.26",
]
isaac = [
    "numpy>=1.26.4,<2",
    "pydicom>=2.4,<4",
    "nibabel>=5.2,<6",
    "scikit-image>=0.22,<0.26",
    "scipy>=1.11,<1.17",
    "imageio>=2.31,<3",
    "monai[fire]>=1.3,<1.6",
    "pytorch-ignite>=0.5,<0.6",
    "torch>=2.2,<2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source/extensions/com.chrisvoncsefalvay.organiq"]

[tool.setuptools]
package-dir = {"" = "source/extensions/com.chrisvoncsefalvay.organiq"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["source/extensions/com.chrisvoncsefalvay.organiq"]
include = ["com*"]
namespaces = true

